[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl-splat"
version = "0.1.0"
description = "Differentiable Gaussian splatting algorithms with NVIDIA Warp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "warp-lang>=1.17"]
license = {file = "dsl_splat/LICENSE.md"}

[tool.setuptools.packages.find]
include = ["dsl_splat*"]

[tool.setuptools.package-data]
dsl_splat = ["py.typed", "*.md", "STOPTHEPOP_LICENSE.txt"]
"dsl_splat.strategy" = ["LICENSE", "*.md"]
"dsl_splat.pgsr" = ["*.md", "*_LICENSE.txt"]

[tool.black]
target-version = ["py310"]
force-exclude = '/render_hierarchical_native\.py$'

# wp.array(...) annotations belong to Warp's compiler. Check the host boundary;
# GPU kernels are validated through compilation and CUDA parity tests.
[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "dsl_splat/aaa/types.py", "dsl_splat/aaa/frame.py", "dsl_splat/aaa/settings.py",
    "dsl_splat/runtime", "dsl_splat/aaa/autograd.py", "dsl_splat/aaa/legacy.py",
    "dsl_splat/aaa/render.py", "dsl_splat/aaa/gsplat.py", "dsl_splat/aaa/config.py",
    "dsl_splat/aaa/cameras.py", "dsl_splat/aaa/metadata.py", "dsl_splat/aaa/pipeline.py",
    "dsl_splat/aaa/api.py", "dsl_splat/aaa/ops.py", "dsl_splat/cameras.py",
    "dsl_splat/inputs.py", "dsl_splat/training.py", "dsl_splat/statistics.py",
    "dsl_splat/gs3d/api.py", "dsl_splat/gs3d/autograd.py", "dsl_splat/gs3d/cameras.py",
    "dsl_splat/gs3d/frame.py", "dsl_splat/gs3d/gsplat.py", "dsl_splat/gs3d/ops.py",
    "dsl_splat/primitives/spherical_harmonics.py",
    "dsl_splat/pgsr/geometry.py", "dsl_splat/pgsr/losses.py", "dsl_splat/pgsr/types.py",
]
