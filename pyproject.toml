[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa-gaussians-warp"
version = "0.1.0"
description = "Differentiable Gaussian renderers with Python-managed NVIDIA Warp JIT"
readme = "aaa_warp/README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "warp-lang>=1.17"]
license = {file = "aaa_warp/LICENSE.md"}

[tool.setuptools.packages.find]
include = ["aaa_warp*"]

[tool.setuptools.package-data]
aaa_warp = ["py.typed", "*.md", "STOPTHEPOP_LICENSE.txt"]

[tool.black]
target-version = ["py310"]
force-exclude = '/render_hierarchical_native\.py$'

# wp.array(...) annotations belong to Warp's compiler. Check the host boundary;
# GPU kernels are validated through compilation and CUDA parity tests.
[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "aaa_warp/aaa/types.py", "aaa_warp/aaa/frame.py", "aaa_warp/aaa/settings.py",
    "aaa_warp/runtime", "aaa_warp/aaa/autograd.py", "aaa_warp/aaa/legacy.py",
    "aaa_warp/aaa/render.py", "aaa_warp/aaa/gsplat.py", "aaa_warp/aaa/config.py",
    "aaa_warp/aaa/cameras.py", "aaa_warp/aaa/metadata.py", "aaa_warp/aaa/pipeline.py",
    "aaa_warp/aaa/api.py", "aaa_warp/aaa/ops.py", "aaa_warp/cameras.py",
    "aaa_warp/inputs.py", "aaa_warp/training.py", "aaa_warp/statistics.py",
    "aaa_warp/gs3d/api.py", "aaa_warp/gs3d/autograd.py", "aaa_warp/gs3d/cameras.py",
    "aaa_warp/gs3d/frame.py", "aaa_warp/gs3d/gsplat.py", "aaa_warp/gs3d/ops.py",
    "aaa_warp/primitives/spherical_harmonics.py",
]
